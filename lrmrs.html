<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRMRS – Laboratory Room Maintenance Request System</title>
<style>
:root{color-scheme:dark;--bg:#020805;--bg2:#06130c;--card:rgba(4,14,9,.90);--tx:#b9f5d0;--mu:#5e8f73;--bd:#12402a;--pr:#00ff9c;--prt:#001a0e;--ac:#00e5ff;--mg:#ff2bd6;--ok:#00ff9c;--wa:#ffd166;--er:#ff3860;--mono:ui-monospace,"Cascadia Code","JetBrains Mono","Fira Code",Consolas,Menlo,monospace}
*{box-sizing:border-box}
::selection{background:var(--pr);color:var(--prt)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--pr)}
body{margin:0;font:15px/1.5 var(--mono);background:var(--bg);color:var(--tx);min-height:100vh}
#mx{position:fixed;inset:0;z-index:-1;opacity:.32;width:100%;height:100%}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
header{background:rgba(2,8,5,.93);border-bottom:1px solid var(--pr);box-shadow:0 0 22px rgba(0,255,156,.28),0 1px 0 var(--mg);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
header h1{margin:0;flex:1;min-width:230px;font-weight:400}
.glitch{position:relative;display:inline-block;font:900 28px var(--mono);letter-spacing:5px;color:var(--pr);text-shadow:0 0 12px var(--pr)}
.glitch:before,.glitch:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;opacity:0}
.glitch:before{color:var(--mg);clip-path:inset(0 0 55% 0);animation:g1 3s infinite steps(1)}
.glitch:after{color:var(--ac);clip-path:inset(55% 0 0 0);animation:g2 3.7s infinite steps(1)}
@keyframes g1{0%,88%{opacity:0;transform:none}89%{opacity:1;transform:translate(-4px,1px)}92%{opacity:1;transform:translate(4px,-1px)}95%,100%{opacity:0}}
@keyframes g2{0%,80%{opacity:0;transform:none}81%{opacity:1;transform:translate(4px,0)}84%{opacity:1;transform:translate(-4px,1px)}87%,100%{opacity:0}}
header small{display:block;color:var(--mu);font-size:11px;letter-spacing:.5px;margin-top:2px;text-transform:uppercase}
header small:before{content:"root@ite-lab:~# ";color:var(--pr)}
header small:after{content:"█";color:var(--pr);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:rgba(0,255,156,.04);color:var(--tx);padding:8px 13px;border-radius:2px;cursor:pointer;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:1px;transition:.15s}
nav button:hover,.btn:hover{border-color:var(--pr);color:var(--pr);box-shadow:0 0 12px rgba(0,255,156,.45),inset 0 0 8px rgba(0,255,156,.15);text-shadow:0 0 6px var(--pr)}
nav button.on,.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr);box-shadow:0 0 12px rgba(0,255,156,.5)}
nav button.on:before{content:"> "}
nav button.on:hover,.btn.p:hover{background:#eafff5;color:var(--prt);box-shadow:0 0 20px var(--pr);text-shadow:none}
.btn.d{color:var(--er);border-color:var(--er)}
main{max-width:1060px;margin:24px auto 70px;padding:0 16px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:0 18px 18px;margin-bottom:18px;position:relative;box-shadow:0 0 0 1px rgba(0,255,156,.04),0 8px 30px rgba(0,0,0,.5)}
.card:hover{border-color:rgba(0,255,156,.45)}
.card:before{content:"root@lrmrs:~$ ./run";display:flex;align-items:center;height:28px;margin:0 -18px 14px;padding-left:64px;font:11px var(--mono);letter-spacing:1px;color:var(--mu);background:#041009 radial-gradient(circle at 14px 14px,#ff3860 4px,transparent 5px),radial-gradient(circle at 30px 14px,#ffd166 4px,transparent 5px),radial-gradient(circle at 46px 14px,#00ff9c 4px,transparent 5px);border-bottom:1px solid var(--bd)}
.card:after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-right:2px solid var(--pr);border-bottom:2px solid var(--pr);pointer-events:none}
.card.stat{padding:16px 10px 14px;border-left:3px solid var(--pr);text-align:center}.card.stat:before{display:none}
h2{margin:0 0 12px;font:800 17px var(--mono);color:var(--pr);text-shadow:0 0 10px rgba(0,255,156,.55);text-transform:uppercase;letter-spacing:1.5px}h2:before{content:"[+] ";color:var(--mg)}
h3{margin:0 0 8px;font:700 12px var(--mono);color:var(--ac);text-transform:uppercase;letter-spacing:1.5px}h3:before{content:"// "}
label{display:block;font:11px var(--mono);color:var(--mu);margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}label:before{content:"$ ";color:var(--pr)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:2px;background:#010503;color:var(--pr);font:14px var(--mono);outline:none;caret-color:var(--pr)}
input::placeholder,textarea::placeholder{color:#2f6048}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr),0 0 14px rgba(0,255,156,.35)}
select option{background:#010503}
input[type=file]{color:var(--mu)}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}.grid .card{margin-bottom:0}
.stat b{font:900 38px var(--mono);display:block;color:var(--pr);text-shadow:0 0 16px var(--pr);animation:fl 5s infinite}
@keyframes fl{0%,94%,100%{opacity:1}95%{opacity:.4}97%{opacity:.9}}
.stat span{color:var(--mu);font:11px var(--mono);text-transform:uppercase;letter-spacing:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--ac);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:1.2px;background:rgba(0,229,255,.05)}
td:first-child{color:var(--pr)}
.tw{overflow-x:auto}
tr.click{cursor:pointer;transition:.12s}tr.click:hover{background:rgba(0,255,156,.09);box-shadow:inset 3px 0 0 var(--pr)}
.tag{display:inline-block;padding:1px 8px;border-radius:2px;font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.8px;border:1px solid currentColor;white-space:nowrap;text-shadow:0 0 6px currentColor}
.s-Pending{color:var(--wa)}.s-Accepted{color:var(--ac)}.s-In-Progress{color:#b48cff}.s-For-Parts-Materials{color:#ff9d4c}.s-Resolved{color:var(--ok)}.s-Closed{color:#7f9a8b}.s-Rejected{color:var(--er)}
.p-Critical{color:var(--er);animation:bl 1.1s steps(1) infinite}.p-High{color:var(--er)}.p-Medium{color:var(--wa)}.p-Low{color:var(--ok)}
.login{max-width:410px;margin:20px auto 0}
.boot{max-width:410px;margin:44px auto 0;font:12px/1.55 var(--mono);color:var(--pr);text-shadow:0 0 6px rgba(0,255,156,.6);white-space:pre-wrap;min-height:86px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:0 0 auto}
.mu{color:var(--mu);font-size:12.5px}.mu a{text-shadow:0 0 6px var(--pr)}
.err{color:var(--er);font:13px var(--mono);margin-top:8px;text-shadow:0 0 6px var(--er)}.err:not(:empty):before{content:"[ERR] "}
dialog{border:1px solid var(--pr);box-shadow:0 0 36px rgba(0,255,156,.35);border-radius:3px;background:#030d08;color:var(--tx);max-width:640px;width:94%;padding:20px;font-family:var(--mono)}
dialog.wide{max-width:900px}
dialog::backdrop{background:rgba(0,0,0,.82)}
img.ph{max-width:100%;max-height:240px;border:1px solid var(--pr);margin-top:6px;filter:saturate(.8) contrast(1.05);box-shadow:0 0 12px rgba(0,255,156,.25)}
.tl{border-left:2px solid var(--pr);margin:8px 0 0 6px;padding-left:12px}.tl div{margin-bottom:8px;font-size:13px}.tl b{color:var(--pr);font-weight:700}
.bell{background:var(--er);color:#fff;border-radius:2px;padding:0 6px;font-size:11px;margin-left:5px;box-shadow:0 0 8px var(--er)}
.bar{height:9px;background:#010503;border:1px solid var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pr) 0 6px,#00a86a 6px 8px);box-shadow:0 0 10px var(--pr)}
hr{border:0;border-top:1px dashed var(--bd)!important}
#warn:not(:empty){position:relative;z-index:25;background:#2e2200;color:var(--wa);padding:8px 16px;font:12px var(--mono);text-align:center;border-bottom:1px solid var(--wa)}
footer{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 16px;background:rgba(2,8,5,.95);border-top:1px solid var(--bd);font:11px var(--mono);color:var(--mu);letter-spacing:1px;text-transform:uppercase}
footer span:first-child{color:var(--pr)}footer span:first-child:before{content:"● ";animation:bl 1.4s steps(1) infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#bbb;--pr:#000;--ac:#000;--ok:#000;--mg:#000;--er:#000;--wa:#000}body{background:#fff;font-family:system-ui,sans-serif}#mx,footer,header,.noprint,.card:before,.card:after,body:before,body:after{display:none!important}.card{border:none;box-shadow:none}*{text-shadow:none!important;box-shadow:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<header>
  <h1><span class="glitch" data-text="LRMRS">LRMRS</span><small>Laboratory Room Maintenance Request System · ITE · NVSU</small></h1>
  <nav id="nav"></nav>
</header>
<div id="warn"></div>
<main id="app"></main>
<footer><span>System online</span><span>ITE-LAB-NET :: secure link</span><span id="clk"></span></footer>
<dialog id="dlg"></dialog>

<script>
const ROOMS=["ITE 101","ITE 102","ITE 201","ITE 202","ITE 203","ITE 301","ITE 302","ITE 303","Faculty Room (1st Floor)","Faculty Room (2nd Floor)"];
const CATS=["Computer","Network Equipment","Electrical","Air-Conditioning Unit","Projector","Lighting","Other"];
const STAT=["Pending","Accepted","In Progress","For Parts/Materials","Resolved","Closed","Rejected"];
const PRIO=["Low","Medium","High","Critical"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=s=>s.replace(/[^A-Za-z]+/g,'-');
const now=()=>new Date().toLocaleString();
const tag=(t,p='s')=>`<span class="tag ${p}-${cls(t)}">${esc(t)}</span>`;

let DB=null;
let storeOK=true;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
try{localStorage.setItem('lrmrs_t','1');localStorage.removeItem('lrmrs_t')}catch(e){storeOK=false}
try{DB=JSON.parse(ls.get('lrmrs'))}catch(e){}
if(!DB)DB={seq:1,requests:[],notifs:[],users:[
  ]};
const save=()=>{if(!ls.set('lrmrs',JSON.stringify(DB))&&storeOK)alert('Browser storage is full. Try a smaller photo.')};
let me=null,view='',filter={s:'',r:''};

/* ---------- shell ---------- */
function render(){
  const nav=$('#nav');
  if(!me){nav.innerHTML='';return loginView();}
  const role=me.role;
  const unread=DB.notifs.filter(n=>n.to===me.u&&!n.read).length;
  const bell='Notifications'+(unread?`<span class="bell">${unread}</span>`:'');
  const tabs=role==='staff'?[['dash','Dashboard'],['all','All Requests'],['hist','Room History'],['rep','Reports'],['acct','Accounts'],['req','Requirements'],['note',bell]]
    :role==='mech'?[['jobs','My Jobs'],['hist','Room History'],['req','Requirements'],['note',bell]]
    :[['new','New Request'],['mine','My Requests'],['req','Requirements'],['note',bell]];
  if(!view||!tabs.some(t=>t[0]===view))view=tabs[0][0];
  nav.innerHTML=tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+
    (role!=='user'?`<button onclick="pwDlg('${esc(me.u)}')">Change password</button>`:'')+`<button onclick="logout()">Logout (${esc(me.u)})</button>`;
  ({dash:dashView,all:allView,rep:repView,new:newView,mine:mineView,note:noteView,jobs:jobsView,hist:histView,acct:acctView,req:reqView})[view]();
}
const go=v=>{view=v;render()};
const logout=()=>{me=null;view='';render()};

/* ---------- login (UConnect NVSU + staff) ---------- */
/* Hook for real UConnect authentication. NVSU does not publish a public login API,
   so this prototype only identifies the user. To use the real thing, ask the NVSU ICT office
   for an OAuth/SSO endpoint and replace this function with a call to it (never collect UConnect passwords here). */
const UCONNECT_PORTAL='https://nvsu.edu.ph';
async function uconnectVerify(id,kind){return {ok:true}}
/* Employee accounts (admin + mechanics) have their own password, separate from UConnect.
   Passwords are stored hashed. Change these demo passwords after the first login. */
const SEED=[{u:'demo-staff',name:'Admin',role:'staff',pw:'admin123'},
            {u:'demo-mech1',name:'Mech One',role:'mech',pw:'mech123'},
            {u:'demo-mech2',name:'Mech Two',role:'mech',pw:'mech123'}];
async function sha(t){
  t='lrmrs:'+t;
  try{if(globalThis.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
async function seedAccounts(){
  for(const a of SEED){const h=await sha(a.pw),u=DB.users.find(x=>x.u===a.u&&x.role===a.role);
    if(!u)DB.users.push({u:a.u,name:a.name,role:a.role,p:h,uconnect:true});
    else if(!u.p)u.p=h}
  save();
}
/* Forms are driven by button clicks + Enter, not native submit (sandboxed previews block form submission). */
const guard=(f,fn)=>{if(!f.reportValidity())return;Promise.resolve().then(fn).catch(e=>{const m=document.querySelector('#msg');if(m)m.textContent='Error: '+e.message})};
try{document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.form&&/^(INPUT|SELECT)$/.test(e.target.tagName)){const b=e.target.form.querySelector('button.p');if(b){e.preventDefault();b.click()}}})}catch(e){}
let ltab='uc',booted=false;
function typeBoot(){
  const el=document.querySelector('#boot');if(!el)return;
  const L=['[ OK ] loading lrmrs kernel ...','[ OK ] linking ITE-LAB-NET ...','[ OK ] mounting /mechanics_room','[ OK ] rooms: 101 102 201 202 203 301 302 303 FAC-1F FAC-2F','[ !! ] authentication required'];
  if(booted){el.textContent=L.join('\n');return}
  booted=true;let i=0,j=0,out='';
  (function t(){
    if(i>=L.length)return;
    if(j<L[i].length){out+=L[i][j++];el.textContent=out+'█';setTimeout(t,9)}
    else{out+='\n';i++;j=0;el.textContent=out;setTimeout(t,70)}
  })();
}
function loginView(t){
  if(t)ltab=t;
  const tabs=`<div class="row" style="gap:6px;margin-bottom:6px"><button class="btn ${ltab==='uc'?'p':''}" style="flex:1" onclick="loginView('uc')">UConnect NVSU</button><button class="btn ${ltab==='st'?'p':''}" style="flex:1" onclick="loginView('st')">UConnect Employee</button></div>`;
  const uc=`<h2>Sign in with UConnect</h2><p class="mu">For NVSU students and faculty. Enter your UConnect account ID.</p>
  <form onsubmit="return false">
  <label>UConnect username / student ID</label><input id="un" required autocomplete="username" placeholder="e.g., 2023-12345">
  <label>Full name</label><input id="fn" required value="${esc(ls.get('lrmrs_last')||'')}">
  <label>I am a</label><select id="rl"><option>Student</option><option>Faculty</option></select>
  <div id="msg" class="err"></div><br>
  <button type="button" class="btn p" style="width:100%" onclick="guard(this.form,doUC)">Continue with UConnect</button></form>
  <p class="mu" style="margin-top:12px">Need your account? <a href="${UCONNECT_PORTAL}" target="_blank" rel="noopener" style="color:var(--pr)">Open the NVSU portal</a></p>
  `;
  const st=`<h2>Sign in with UConnect Employee</h2><p class="mu">For maintenance admins and mechanics.</p>
  <form onsubmit="return false">
  <label>Employee ID / username</label><input id="un" required autocomplete="username" placeholder="e.g., demo-mech1">
  <label>Password</label><input id="pw" type="password" required autocomplete="current-password">
  <div id="msg" class="err"></div><br>
  <button type="button" class="btn p" style="width:100%" onclick="guard(this.form,doStaff)">Sign in</button></form>
  <p class="mu" style="margin-top:12px">Demo accounts (change after first login):<br><b>demo-staff</b> / admin123 (admin)<br><b>demo-mech1</b>, <b>demo-mech2</b> / mech123 (mechanics)</p>`;
  $('#app').innerHTML=`<pre class="boot" id="boot"></pre><div class="card login">${tabs}${ltab==='uc'?uc:st}<p class="mu" style="text-align:center;margin-top:14px"><a href="#" style="color:var(--pr)" onclick="reqDlg();return false">System requirements</a></p></div>`;
  typeBoot();
}
async function doUC(){
  const id=$('#un').value.trim().toLowerCase(),role=$('#rl').value;let name=$('#fn').value.trim();
  let v={ok:false};try{v=await uconnectVerify(id,'student')}catch(e){}
  if(!v.ok){$('#msg').textContent='UConnect could not verify this account.';return false}
  name=v.name||name;
  let u=DB.users.find(x=>x.u===id&&x.role==='user');
  if(!u){u={u:id,p:null,name,role:'user',type:role,uconnect:true};DB.users.push(u)}
  else{u.name=name;u.type=role}
  save();ls.set('lrmrs_last',name);
  me=u;render();return false;
}
async function doStaff(){
  const id=$('#un').value.trim().toLowerCase(),h=await sha($('#pw').value);$('#pw').value='';
  const u=DB.users.find(x=>x.u===id&&x.role!=='user'&&x.p===h);
  if(!u){$('#msg').textContent='Incorrect employee ID or password.';return false}
  me=u;render();return false;
}

/* ---------- student ---------- */
function newView(){
  $('#app').innerHTML=`<div class="card"><h2>Submit a maintenance request</h2>
  <form onsubmit="return false">
  <div class="grid"><div><label>Room</label><select id="room">${ROOMS.map(r=>`<option>${r}</option>`).join('')}</select></div>
  <div><label>Problem category</label><select id="cat">${CATS.map(r=>`<option>${r}</option>`).join('')}</select></div>
  <div><label>How urgent is it?</label><select id="urg"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div>
  <label>Describe the problem</label><textarea id="desc" required placeholder="e.g., PC 12 will not turn on; the power light does not light up."></textarea>
  <label>Photo evidence (optional)</label><input id="ph" type="file" accept="image/*" onchange="prev(this)">
  <img id="pv" class="ph" style="display:none">
  <br><button type="button" class="btn p" onclick="guard(this.form,submitReq)">Submit request</button></form></div>`;
}
let photoData='';
function prev(inp){
  photoData='';const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    photoData=c.toDataURL('image/jpeg',.7);const pv=$('#pv');pv.src=photoData;pv.style.display='block'};im.src=r.result};
  r.readAsDataURL(f);
}
function submitReq(){
  const id='LR-'+String(DB.seq++).padStart(4,'0'),urg=$('#urg').value;
  DB.requests.push({id,by:me.u,byName:me.name,room:$('#room').value,cat:$('#cat').value,urg,desc:$('#desc').value.trim(),
    photo:photoData,date:now(),status:'Pending',prio:urg,log:[{d:now(),by:me.name,t:'Request submitted.'}],repair:null});
  photoData='';save();alert('Request '+id+' submitted. Maintenance staff have been notified.');go('mine');return false;
}
function reqTable(list,staff,keep){
  if(!list.length)return '<p class="mu">No requests found.</p>';
  return `<div class="tw"><table><tr><th>ID</th><th>Room</th><th>Category</th>${staff?'<th>By</th><th>Mechanic</th>':''}<th>Priority</th><th>Status</th><th>Date</th></tr>
  ${(keep?list:list.slice().reverse()).map(r=>`<tr class="click" onclick="detail('${r.id}')"><td>${r.id}</td><td>${esc(r.room)}</td><td>${esc(r.cat)}</td>${staff?`<td>${esc(r.byName)}</td><td>${r.assignedName?esc(r.assignedName):'<span class="mu">—</span>'}</td>`:''}<td>${tag(r.prio,'p')}</td><td>${tag(r.status)}</td><td class="mu">${esc(r.date)}</td></tr>`).join('')}</table></div>`;
}
function mineView(){

const mechOpts=sel=>DB.users.filter(x=>x.role==='mech').map(u=>`<option value="${esc(u.u)}" ${u.u===sel?'selected':''}>${esc(u.name+' ('+u.u+')')}</option>`).join('');
let afterData='';
function prevAfter(inp){
  afterData='';const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    afterData=c.toDataURL('image/jpeg',.7);const pv=$('#pv2');pv.src=afterData;pv.style.display='block'};im.src=rd.result};
  rd.readAsDataURL(f);
}
function detail(id){
  const r=DB.requests.find(x=>x.id===id),admin=me.role==='staff',d=$('#dlg');
  const canWork=me.role==='mech'&&r.assignedTo===me.u&&!['Closed','Rejected'].includes(r.status);
  afterData='';
  let h=`<h2>${r.id} · ${esc(r.room)}</h2>
  <p>${tag(r.status)} ${tag(r.prio,'p')} <span class="mu">${esc(r.cat)} · by ${esc(r.byName)} · ${esc(r.date)}</span></p>
  <p class="mu">Mechanic: ${r.assignedName?esc(r.assignedName):'Unassigned'}${r.startedAt?' · started '+esc(r.startedAt):''}${r.doneAt?' · done '+esc(r.doneAt):''}</p>
  <p>${esc(r.desc)}</p>${r.photo?`<img class="ph" src="${r.photo}">`:''}
  ${r.parts?`<p><b>Parts/materials needed:</b> ${esc(r.parts)}</p>`:''}
  ${r.repair?`<h3 style="margin-top:12px">Repair record</h3><p class="mu">${esc(r.repair.action)} — ${esc(r.repair.tech)} (${esc(r.repair.date)})</p>`:''}
  ${r.after?`<h3 style="margin-top:12px">After repair</h3><img class="ph" src="${r.after}">`:''}
  <h3 style="margin-top:12px">Status history &amp; remarks</h3><div class="tl">${r.log.map(l=>`<div><b>${esc(l.d)}</b> · ${esc(l.by)}<br>${esc(l.t)}</div>`).join('')}</div>`;
  if(admin)h+=`<hr style="margin:14px 0"><h3>Admin update</h3>
  <div class="row"><div><label>Status</label><select id="ns">${STAT.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label>Priority</label><select id="np">${PRIO.map(s=>`<option ${s===r.prio?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <label>Assign mechanic</label><select id="am"><option value="">— Unassigned —</option>${mechOpts(r.assignedTo)}</select>
  <label>Remarks</label><textarea id="nr" style="min-height:60px"></textarea>`;
  if(canWork){const opts=['In Progress','For Parts/Materials','Resolved'];h+=`<hr style="margin:14px 0"><h3>Mechanics room · log your work</h3>
  <label>Status</label><select id="ms">${opts.map(s=>`<option ${s===(opts.includes(r.status)?r.status:'In Progress')?'selected':''}>${s}</option>`).join('')}</select>
  <label>Work notes</label><textarea id="mn" style="min-height:60px"></textarea>
  <label>Parts/materials needed (if any)</label><input id="mp" value="${esc(r.parts||'')}">
  <label>Repair action taken (required to resolve)</label><input id="ma" value="${esc(r.repair?.action||'')}">
  <label>After-repair photo (optional)</label><input type="file" accept="image/*" onchange="prevAfter(this)"><img id="pv2" class="ph" style="display:none">`}
  h+=`<br><div class="row" style="justify-content:flex-end">${admin?`<button class="btn p" onclick="saveReq('${id}')">Save update</button>`:''}${canWork?`<button class="btn p" onclick="saveJob('${id}')">Save work</button>`:''}<button class="btn" onclick="$('#dlg').close()">Close</button></div>`;
  d.innerHTML=h;d.showModal();
}
function notifyAdmins(t){DB.users.filter(x=>x.role==='staff').forEach(a=>DB.notifs.push({to:a.u,t,d:now(),read:false}))}
function saveReq(id){
  const r=DB.requests.find(x=>x.id===id),np=$('#np').value,rem=$('#nr').value.trim(),am=$('#am').value;let ns=$('#ns').value;
  const ch=[];
  if(am&&am!==(r.assignedTo||'')){
    const u=DB.users.find(x=>x.u===am&&x.role==='mech');r.assignedTo=am;r.assignedName=u?u.name:am;
    ch.push(`Assigned to mechanic ${r.assignedName}.`);if(ns==='Pending')ns='Accepted';
    DB.notifs.push({to:am,t:`New job ${r.id} (${r.room}, ${r.cat}, ${np} priority) was assigned to you.`,d:now(),read:false});
  }else if(!am&&r.assignedTo){r.assignedTo='';r.assignedName='';ch.push('Mechanic unassigned.')}
  if(ns!==r.status)ch.push(`Status changed to ${ns}.`);
  if(np!==r.prio)ch.push(`Priority set to ${np}.`);
  if(rem)ch.push('Remarks: '+rem);
  if(!ch.length){$('#dlg').close();return}
  r.status=ns;r.prio=np;r.log.push({d:now(),by:me.name,t:ch.join(' ')});
  DB.notifs.push({to:r.by,t:`${r.id} (${r.room}): ${ch.join(' ')}`,d:now(),read:false});
  save();$('#dlg').close();render();
}
function saveJob(id){
  const r=DB.requests.find(x=>x.id===id),ns=$('#ms').value,notes=$('#mn').value.trim(),parts=$('#mp').value.trim(),act=$('#ma').value.trim();
  if(ns==='For Parts/Materials'&&!parts){alert('List the parts or materials needed.');return}
  if(ns==='Resolved'&&!act){alert('Describe the repair action taken before resolving.');return}
  const ch=[];
  if(ns!==r.status){ch.push(`Status changed to ${ns}.`);if(ns==='In Progress'&&!r.startedAt){r.startedAt=now();ch.push('Work started.')}}
  if(parts&&parts!==r.parts){r.parts=parts;ch.push('Parts/materials needed: '+parts+'.')}
  if(notes)ch.push('Work notes: '+notes);
  if(ns==='Resolved'){r.repair={action:act,tech:me.name,date:now()};r.doneAt=now();if(afterData)r.after=afterData;ch.push('Repair done: '+act+'.')}
  if(!ch.length){$('#dlg').close();return}
  r.status=ns;r.log.push({d:now(),by:me.name+' (mechanic)',t:ch.join(' ')});
  const msg=`${r.id} (${r.room}): ${ch.join(' ')}`;
  DB.notifs.push({to:r.by,t:msg,d:now(),read:false});notifyAdmins(msg);
  afterData='';save();$('#dlg').close();render();
}

async function savePw(uid){
  const u=DB.users.find(x=>x.u===uid&&x.role!=='user'),p1=$('#p1').value;
  if(!u||(me.role!=='staff'&&uid!==me.u))return;
  if(p1.length<6){$('#pm').textContent='Use at least 6 characters.';return}
  if(p1!==$('#p2').value){$('#pm').textContent='Passwords do not match.';return}
  if(uid===me.u&&u.p!==await sha($('#p0').value)){$('#pm').textContent='Current password is incorrect.';return}
  u.p=await sha(p1);save();$('#dlg').close();alert('Password updated.');
}

async function addAcct(){
  const id=$('#ai').value.trim().toLowerCase(),name=$('#an').value.trim(),pw=$('#ap').value;
  if(!/^[a-z0-9._-]+$/.test(id)){$('#am2').textContent='ID may only use letters, numbers, - . _';return}
